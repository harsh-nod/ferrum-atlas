name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            target
            adapters/rustc/target
          key: compiler-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'adapters/rustc/Cargo.lock', 'adapters/rustc/rust-toolchain.toml') }}
      - name: Exact compiler adapter tests
        working-directory: adapters/rustc
        run: |
          rustup show
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Real compiler import workflow
        run: |
          ATLAS_RUSTC="$PWD/adapters/rustc/target/debug/atlas-rustc" cargo test --locked -p ferrum-atlas --test compiler_workflow -- --ignored
          ATLAS_TEST_COMPILER="$PWD/adapters/rustc/target/debug/atlas-rustc" cargo test --locked -p atlas-evidence actual_pinned_adapter_fixture_passes_strict_import_contract -- --ignored
      - name: Build browser
        working-directory: web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Real compiler to browser workflow
        working-directory: web
        run: ATLAS_RUSTC="$PWD/../adapters/rustc/target/debug/atlas-rustc" npx playwright test tests/live.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compiler-browser-evidence
          path: web/test-results/
          if-no-files-found: ignore
  contracts-and-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Rust toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust unit, recovery, authorization, and process workflow tests
        run: cargo test --locked --workspace
      - name: Generated transport contracts
        run: cargo run --locked -p xtask -- check-types
      - name: Qualification and study validation
        run: |
          python3 -m unittest discover -s benchmarks -p 'test_*.py'
          python3 benchmarks/validate.py report benchmarks/reports/regex-semantic-20260915.json
          python3 benchmarks/validate.py report benchmarks/reports/synthetic-100k-20260915.json
          python3 benchmarks/validate.py report benchmarks/reports/synthetic-100k-cached-20260915.json
      - name: Viewer dependencies
        working-directory: web
        run: npm ci
      - name: Viewer build and types
        working-directory: web
        run: npm run build
      - name: Browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser workflows
        working-directory: web
        run: npm test
      - name: Capture the real pilot
        run: |
          cargo run --locked -p ferrum-atlas -- --store .atlas-ci init --workspace fixtures/rust/pilot --trust read-only
          target/debug/atlas --store .atlas-ci index --level semantic
          target/debug/atlas --store .atlas-ci doctor
          target/debug/atlas --store .atlas-ci benchmark --samples 30 --output benchmark-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: acceptance-evidence
          path: |
            web/test-results/
            web/playwright-report/
            benchmark-smoke.json
          if-no-files-found: ignore
